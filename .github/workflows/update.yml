name: Update profile card

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no moving major tag, so pin the release
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          cache-dependency-glob: make_card.py  # dependencies live in its PEP 723 header
      - name: Redraw card
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run make_card.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          if git diff --cached --quiet; then
            echo "Card unchanged"
          else
            git commit -m "Update profile card"
            git push
          fi
